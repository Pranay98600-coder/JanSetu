spring.application.name=jansetu-backend

# ==========================================
# JANSETU - APPLICATION CONFIGURATION
# ==========================================



server.port=8080

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/jansetu_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA AND HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# Disable Open EntityManager in View
spring.jpa.open-in-view=false

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================

spring.servlet.multipart.max-file-size=5MB

spring.servlet.multipart.max-request-size=10MB